baseURL = 'https://nianzhao3-cloud.github.io/laozhao/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
title = '老赵的博客'
theme = 'PaperMod'

paginate = 10
enableRobotsTXT = true

[params]
  author = '老赵'
  description = '用来放b站每期的教学文档，粉丝群：571228203'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = '你好，欢迎来我的博客'
    Content = '记录，分享，相遇'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/nianzhao3-cloud'

[menu]
  [[menu.main]]
    name = '文章'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    name = '归档'
    url = '/archives/'
    weight = 20
  [[menu.main]]
    name = '标签'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    name = '搜索'
    url = '/search/'
    weight = 40
  [[menu.main]]
    name = '关于'
    url = '/about/'
    weight = 50

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[caches]
  [caches.images]
    dir = ':cacheDir/images'
