baseURL = 'https://你的用户名.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
title = '我的博客'
theme = 'PaperMod'

paginate = 10
enableRobotsTXT = true

[params]
  author = '你的名字'
  description = '这里写一句你的博客简介'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = '你好，欢迎来我的博客'
    Content = '这里放一句欢迎语。'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/你的用户名'

[menu]
  [[menu.main]]
    name = '文章'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    name = '归档'
    url = '/archives/'
    weight = 20
  [[menu.main]]
    name = '标签'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    name = '搜索'
    url = '/search/'
    weight = 40
  [[menu.main]]
    name = '关于'
    url = '/about/'
    weight = 50

[markup]
  [markup.highlight]
    noClasses = false
 [markup.goldmark.renderer]
    unsafe = true
[outputs]
  home = ['HTML', 'RSS', 'JSON']

[caches]
  [caches.images]
    dir = ':cacheDir/images'
